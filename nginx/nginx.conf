# OpenRelay — nginx reverse proxy
#
# Setup:
#   sudo cp nginx.conf /etc/nginx/sites-available/openrelay
#   sudo ln -s /etc/nginx/sites-available/openrelay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS (recommended):
#   sudo certbot --nginx -d your-domain.com
#   Certbot rewrites this file automatically.

# ── Internal upstreams ────────────────────────────────────────────────────────
upstream openrelay_ws  { server 127.0.0.1:7777; }   # WebSocket relay
upstream openrelay_api { server 127.0.0.1:7778; }   # REST API + /metrics

# ── HTTP → HTTPS redirect (uncomment after getting a cert) ───────────────────
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl;             # uncomment after certbot
    server_name your-domain.com;  # replace with your actual domain or IP

    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── WebSocket relay (/relay) ──────────────────────────────────────────────
    # Clients connect here: ws://your-domain.com/relay?code=ABCDEF&token=...
    location /relay {
        proxy_pass         http://openrelay_ws;
        proxy_http_version 1.1;

        # These two headers are required for WebSocket upgrade.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WS connections alive for up to 1 hour of inactivity.
        # ws_peer.go sends Ping every 30 s, so idle connections stay alive.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }

    # ── REST API (/api/v1/) ───────────────────────────────────────────────────
    # Unity clients call: POST /api/v1/sessions/create  or  POST /api/v1/sessions/join
    location /api/ {
        proxy_pass          http://openrelay_api;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  15s;

        # CORS — widen or restrict as needed
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://openrelay_api;
        proxy_set_header Host $host;
        access_log off;   # skip health-check spam in logs
    }

    # ── Prometheus metrics (internal only — block from public) ───────────────
    location /metrics {
        proxy_pass http://openrelay_api;
        proxy_set_header Host $host;

        # Restrict to localhost and your monitoring server.
        allow 127.0.0.1;
        # allow YOUR_MONITORING_IP;
        deny all;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
}

# ── UDP relay (port 7779) ─────────────────────────────────────────────────────
# UDP cannot be proxied by nginx's http block.
# Option A (simple): open port 7779 in your firewall and let the relay container
#                    bind directly (already the case in docker-compose.yml).
# Option B (nginx stream module): uncomment the stream block in
#   /etc/nginx/nginx.conf (outside any http block) and add:
#
# stream {
#     server {
#         listen     7779 udp;
#         proxy_pass 127.0.0.1:7779;
#     }
# }
